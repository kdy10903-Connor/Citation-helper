* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
header { padding: 14px 14px 10px; border-bottom: 3px double var(--rule); }
h1 { font: 600 22px/1.1 Georgia, "Times New Roman", serif; margin: 0; } h1 span { color: var(--accent); font-style: italic; margin-right: 6px; }
header p { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); }
nav { display: flex; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--rule); }
nav button { font: inherit; border: 0; background: none; color: var(--ink-2); padding: 9px 0; cursor: pointer; border-bottom: 2px solid transparent; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
main { padding: 14px; }
.btn { font: inherit; font-weight: 600; border: 1px solid var(--navy); background: var(--navy); color: var(--paper); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.small { font-size: 12.5px; padding: 4px 9px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
textarea { width: 100%; min-height: 84px; font: 14px/1.5 Georgia, serif; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink); }
.cite { font: 15px/1.55 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.card.ok { border-left: 3px solid var(--ok); } .card.fix { border-left: 3px solid var(--fix); } .card.review { border-left: 3px solid var(--rev); }
.pill { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.pill.ok { color: var(--ok); background: var(--ok-soft); } .pill.fix { color: var(--fix); background: var(--fix-soft); } .pill.review { color: var(--rev); background: var(--rev-soft); }
.num { font: italic 600 17px Georgia, serif; color: var(--accent); margin-right: 6px; }
.diff { font: 13.5px/1.6 Georgia, serif; color: var(--ink-2); overflow-wrap: anywhere; margin: 6px 0; }
.diff del { background: var(--del); color: var(--ink); } .diff ins { background: var(--ins); color: var(--ink); text-decoration: none; }
ul.notes { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
ul.notes li { margin: 2px 0; } .tag { font: 11px ui-monospace, Menlo, monospace; background: var(--navy-soft); color: var(--navy); border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.status { font-size: 12.5px; color: var(--ink-2); margin: 8px 0; min-height: 1.2em; }
.summary { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

<header><h1><span>§</span>Citation Helper</h1><p>The Indigo Book 2.0 · runs inside Word, nothing is sent anywhere</p></header>
<nav role="tablist"><button role="tab" id="t-check" aria-selected="true">Check footnotes</button><button role="tab" id="t-insert" aria-selected="false">Insert citation</button></nav>
<main>

    <div class="row"><button class="btn" id="scan">Check all footnotes</button><button class="btn ghost" id="applyAll" hidden>Apply all fixes</button></div>

    <div class="summary" id="summary"></div>
    <div id="results"></div>
  </section>
  <section id="v-insert" hidden>
    <textarea id="in" placeholder="Paste a rough citation, a URL or a statute"></textarea>
    <div class="card"><div class="cite" id="out"></div><ul class="notes" id="notes"></ul></div>
    <div class="row"><button class="btn" id="insertFn">Insert as footnote here</button></div>
    <div class="status" id="status2"></div>
  </section>
</main>

<script>// Citation engine: parses pasted citations and rebuilds them under The Indigo Book 2.0.
// Works in the browser (window.CiteEngine) and in Node (module.exports). Needs DATA (data.json).
(function (root) {
  'use strict';
  var DATA = root.CITE_DATA || (typeof require !== 'undefined' ? require('./data.json') : null);
  var AP = '\u2019'; // typographic apostrophe used by the Indigo Book
  var opts = { dash: '-' }; // page-span dash: '-' (practice) or '\u2013' (formal)

  // ---------- helpers ----------
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function clean(s) {
    return String(s || '')
      .replace(/[\u2018\u2032`]/g, AP).replace(/'/g, AP)
      .replace(/[\u201C\u201D]/g, function (c) { return c; })

    }).then(function () { $('status').textContent = 'Applied ' + indexes.length + ' fix' + (indexes.length > 1 ? 'es' : '') + '. Use Undo in Word to revert.'; $('scan').onclick(); })
      .catch(function (e) { $('status').textContent = 'Could not change the footnote: ' + e.message; });
  }
  $('results').addEventListener('click', function (e) {
    var a = e.target.closest('[data-apply]'), g = e.target.closest('[data-go]');
    if (a) apply([+a.getAttribute('data-apply')]);
    if (g) Word.run(function (ctx) { var fns = ctx.document.body.footnotes; fns.load('items'); return ctx.sync().then(function () { fns.items[+g.getAttribute('data-go')].reference.select(); return ctx.sync(); }); });
  });
  $('applyAll').onclick = function () { apply(last.map(function (r, i) { return r.status === 'fix' ? i : -1; }).filter(function (i) { return i >= 0; })); };

  // insert tab
  var cur = null, deb;
  function conv() {
    var t = $('in').value; cur = t.trim() ? E.convert(t) : null;
    $('out').innerHTML = cur ? cur.html : '<span style="color:var(--ink-3)">The formatted citation appears here.</span>';
    var n = '';
    if (cur) { (cur.missing || []).forEach(function (m) { n += '<li><span class="tag">missing</span>' + escH(m) + '</li>'; }); (cur.warn || []).forEach(function (m) { n += '<li><span class="tag">check</span>' + escH(m) + '</li>'; }); (cur.notes || []).forEach(function (x) { n += '<li><span class="tag">' + escH(x.rule) + '</span>' + escH(x.msg) + '</li>'; }); }
    $('notes').innerHTML = n;
  }
  $('in').addEventListener('input', function () { clearTimeout(deb); deb = setTimeout(conv, 150); });
  $('insertFn').onclick = function () {
    if (!cur || !cur.segs) return;
    // Pick Id./short form from the footnotes already in the document before the cursor.
    Word.run(function (ctx) {
      var fns = ctx.document.body.footnotes; fns.load('items');
      return ctx.sync().then(function () {
        var htmls = fns.items.map(function (f) { return f.body.getHtml(); });
        return ctx.sync().then(function () {
          var prior = htmls.map(function (h) { return htmlToLine(h.value); });
          var res = E.analyze(prior.concat([cur.text]));
          var segs = res[res.length - 1].segs;
          var sel = ctx.document.getSelection();
          var fn = sel.insertFootnote('');
          return writeSegs(ctx, fn.body, segs).then(function () { $('status2').textContent = 'Inserted as footnote ' + (prior.length + 1) + ' (' + (res[res.length - 1].items[0].form || 'full') + ' form). If you inserted it before other footnotes, run the check again.'; });
        });
      });
    }).catch(function (e) { $('status2').textContent = 'Could not insert: ' + e.message; });
  };
  conv();
  Office.onReady(function (info) { if (info.host !== Office.HostType.Word) $('status').textContent = 'Open this add-in in Microsoft Word.'; });
})();
</script>
